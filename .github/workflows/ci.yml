name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test ./...

      - name: 构建
        run: go build -o /dev/null .
